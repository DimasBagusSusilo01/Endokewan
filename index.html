<!DOCTYPE HTML>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDOKEWAN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styleindex.css">
    <link rel="stylesheet" href="karduscss.css">
  </head>
  <body>
    <div id="toast"></div>
  <div class="kamera"><div class="semua" id="bungkus">
    <div class="panelkiri">
      <div class="kertas"><p id="teks" color="black" align="center"></p></div>
      </div>
    <div class="tengah">
      <div class="bungkus">
      <div class="hp" id="hp">
        <div class="wajah depan"><img src="logo.png"><div class="ui" id="ui"><div class="sprite" id="sprite"></div></div></div>
        <div class="wajah belakang"></div>
        <div class="wajah atas"></div>
        <div class="wajah bawah"></div>
        <div class="wajah kiri"></div>
        <div class="wajah kanan"><button class="power" onclick="power()">🔴</button></div>
      </div>
      <div class="controller2">
        <div class="btn up"    data-dir="up">▲</div>
        <div class="btn down"  data-dir="down">▼</div>
        <div class="btn leftb" data-dir="left">◀</div>
        <div class="btn rightb"data-dir="right">▶</div>
      </div></div></div>
      <div class="panelkanan">
        <img src="bot.png" id="gbot">
          <div class="mata">
            <div class="mata1"></div>
            <div class="mata2"></div>
          </div>
      </div>
      </div></div>
    <footer id="navigasi">
      <div class="peluncur"></div>
        <button class="tombol" data-index="0" onclick="gulir(this)"><div class="ikon"></div></button>
        <button class="tombol aktif" data-index="1" onclick="gulir(this)"><div class="ikon"></div></button>
        <button class="tombol" data-index="2" onclick="gulir(this)"><div class="ikon"></div></button>
    </footer>
    <script src="scriptindex.js"></script>
    <script src="gulirfooter.js"></script>
